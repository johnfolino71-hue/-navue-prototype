name: NaVue polish correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/navue-polish-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          # Combined premium vehicle + colour screen; remove oversized colour step.
          s=s.replace(".vehicle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}",".vehicle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.vehicle-personalize{padding:20px 18px max(28px,env(safe-area-inset-bottom))}.vehicle-personalize h1{font-size:27px;margin:7px 0}.vehicle-personalize p{margin:5px 0 8px}.vehicle-personalize .vehicle-card{min-height:98px;padding:7px;border-radius:14px;font-size:12px}.vehicle-personalize .vehicle-card svg{height:62px;width:96px}.vehicle-personalize .colors{justify-content:center;margin:10px 0 5px}.vehicle-personalize .swatch{width:34px;height:34px}.safe-next{margin-bottom:max(12px,env(safe-area-inset-bottom))}")
          s=s.replace('<section id="vehicleScreen" class="screen">','<section id="vehicleScreen" class="screen vehicle-personalize">')
          old='<p class="small">This becomes your position marker on the NaVue map. Change it anytime.</p><div id="vehicleChoices" class="vehicle-grid"></div><button onclick="showColorScreen()">Choose color</button></section><section id="colorScreen" class="screen"><div class="brand">NaVue</div><h1>Choose your color.</h1><div id="vehiclePreview" style="text-align:center;margin:24px"></div><div id="colorChoices" class="colors"></div><button onclick="showVoiceScreen()">Choose voice</button></section>'
          new='<p class="small">Choose a vehicle and colour. You can change both anytime.</p><div id="vehicleChoices" class="vehicle-grid"></div><div class="small" style="font-weight:800;margin-top:8px">COLOUR</div><div id="colorChoices" class="colors"></div><button class="safe-next" onclick="showVoiceScreen()">Choose voice</button></section>'
          s=s.replace(old,new)
          # render colours on the combined screen and make vehicle choice immediately update.
          s=s.replace("function renderVehicles(el,selectFn)","function renderVehicles(el,selectFn)")
          s=s.replace("function showVehicleScreen(){renderVehicles(vehicleChoices,v=>{p.vehicle=v;renderVehicles(vehicleChoices,arguments.callee)});show('vehicleScreen')}","function showVehicleScreen(){renderVehicles(vehicleChoices,v=>{p.vehicle=v;showVehicleScreen()});renderColors();show('vehicleScreen')}")
          # If exact old function differs, hook renderColors whenever vehicle screen is shown.
          s=s.replace("show('vehicleScreen')}","renderColors();show('vehicleScreen')}",1)
          # Colour handler should stay on vehicle screen instead of requiring giant preview page.
          s=s.replace("vehiclePreview.innerHTML=vehicleSVG(p.vehicle,p.vehicleColor);","")
          # Onboarding profile signal 3: add a balanced third choice.
          s=s.replace("['I usually take the faster route','fast'],['I usually take the shorter route','short']","['I usually take the faster route','fast'],['I usually take the shorter route','short'],['I usually balance time and distance','balanced']")
          s=s.replace("['Faster — even if it is longer','fast'],['Shorter — even if it takes longer','short']","['Faster — even if it is longer','fast'],['Shorter — even if it takes longer','short'],['Balanced — a good mix of time and distance','balanced']")
          # Route marker: center the vehicle mathematically on the same route-line anchor.
          s=s.replace(".car-dot{position:absolute;left:47.2%;",".car-dot{position:absolute;left:46%;")
          # Better selection artwork: richer 3/4 silhouettes, windows, wheels, highlights, type-specific proportions.
          a=s.find('function vehicleDisplaySVG('); b=s.find('function renderVehicles(',a)
          if a!=-1 and b!=-1:
            fn=r'''function vehicleDisplaySVG(type,color){let cfg={sedan:[108,48,20],suv:[108,58,16],sports:[110,40,26],convertible:[108,42,25],pickup:[116,55,15],truck:[124,61,10]}[type]||[108,48,20],w=cfg[0],h=cfg[1],r=cfg[2],open=type==='convertible',pickup=type==='pickup',truck=type==='truck',sport=type==='sports';let body=truck?`<path d="M8 29L18 13h32l12 9h54v34H61l-12 9H18L8 49Z" fill="${color}" stroke="#172126" stroke-width="2"/><path d="M64 26h47v25H64Z" fill="#f1f4f6"/><path d="M20 18h27l9 8H17Z" fill="#8fb6c9"/>`:pickup?`<path d="M7 33L18 16h48l15 12h31v30H72l-11 8H18L7 50Z" fill="${color}" stroke="#172126" stroke-width="2"/><path d="M79 32h28v20H76Z" fill="#26343c" opacity=".3"/><path d="M23 20h37l12 10H17Z" fill="#8fb6c9"/>`:`<path d="M6 38L17 22Q22 ${r} 34 ${r-3}h43q15 1 24 12l9 12-8 16H15L6 51Z" fill="${color}" stroke="#172126" stroke-width="2"/><path d="M28 22h49q10 2 17 13l-15 1-11-9H37l-9 9-14-1q6-10 14-13Z" fill="#8fb6c9"/>${open?'<path d="M35 27h36l9 9H27Z" fill="#1f2a30"/>':''}${sport?'<path d="M15 49h86" stroke="#fff" opacity=".45" stroke-width="2"/>':''}`;return `<svg viewBox="0 0 130 78" aria-label="${type}"><ellipse cx="65" cy="66" rx="52" ry="7" fill="#000" opacity=".13"/><g transform="skewX(-5)">${body}<ellipse cx="27" cy="59" rx="10" ry="7" fill="#111820"/><ellipse cx="91" cy="59" rx="10" ry="7" fill="#111820"/><ellipse cx="27" cy="59" rx="5" ry="4" fill="#b7c0c5"/><ellipse cx="91" cy="59" rx="5" ry="4" fill="#b7c0c5"/><path d="M20 30Q58 10 100 37" fill="none" stroke="#fff" stroke-width="3" opacity=".35"/></g></svg>`}'''
            s=s[:a]+fn+s[b:]
          # Audio: preload Kokoro from a user gesture, provide visible load status, never substitute browser speech.
          s=s.replace("<p>Preview each voice with your own greeting.</p><div id=\"voiceChoices\"></div>","<p>Preview each voice with your own greeting.</p><div id=\"kokoroStatus\" class=\"voice-note\">Tap Preview to load the real Kokoro voice. The first preview may take a moment.</div><div id=\"voiceChoices\"></div>")
          s=s.replace("function previewVoice(style){speak(greet(),true,style)}","async function previewVoice(style){let x=document.getElementById('kokoroStatus');if(x)x.textContent='Loading real Kokoro voice…';await speak(greet(),true,style,()=>{if(x)x.textContent='Preview finished. This is the selected Kokoro voice.'})}")
          # Audio unlock on onboarding Continue: iOS requires user gesture for WebAudio/media. Warm model while user proceeds.
          s=s.replace("function showVoiceGuidanceScreen(){","function unlockKokoro(){try{let a=new Audio();a.play().catch(()=>{})}catch(e){}getKokoro().catch(()=>{})}function showVoiceGuidanceScreen(){unlockKokoro();")
          # Speaker ON must initialize actual voice after Start NaVue user gesture.
          s=s.replace("function completeOnboarding(){p.onboarded=true;voiceFlow=!!p.micEnabled;save();showHome(true)}","function completeOnboarding(){p.onboarded=true;voiceFlow=!!p.micEnabled;save();unlockKokoro();showHome(true)}")
          # Ensure compact routes stay no-scroll-oriented on phone.
          s=s.replace(".routes-compact{padding:18px 18px 24px}",".routes-compact{padding:12px 16px max(18px,env(safe-area-inset-bottom));overflow:hidden}.routes-compact #routeCards{display:grid;gap:4px}")
          p.write_text(s)
          PY
          git config user.name "NaVue Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Polish NaVue vehicles audio onboarding and route layout"
          git push
