name: NaVue Active Navigation Refinement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/navue-active-navigation-refinement.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine active navigation presentation only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* NAVUE_ACTIVE_NAV_REFINEMENT_V1 */'
          if marker not in s:
              css='''<style>/* NAVUE_ACTIVE_NAV_REFINEMENT_V1 */
          /* Presentation only: preserve voice, mic, conversation, onboarding and routing logic. */
          #navigation .turn-card{top:14px;left:12px;right:68px;border-radius:16px;padding:11px 13px;box-shadow:0 3px 12px #0002;z-index:5}
          #navigation .speaker{top:14px;right:12px;width:46px;height:46px;z-index:6;box-shadow:0 3px 12px #0002}
          #navigation .nav-mic{top:70px;right:12px;width:46px;min-width:46px;height:46px;border-radius:14px;z-index:6}
          #navigation .nav-mic:after{top:49px}
          #navigation .car-dot{top:auto;bottom:154px;width:38px;height:52px;z-index:4;filter:drop-shadow(0 4px 5px #0004)}
          #navigation .car-dot svg{width:100%!important;height:100%!important;display:block}
          #navigation .nav-bottom{left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:20px;padding:11px 13px;box-shadow:0 -2px 12px #00000010;z-index:5}
          #navigation .nav-metrics strong{font-size:19px}
          #navigation .finish{padding:9px;font-size:13px;margin-top:9px}
          </style>'''
              s=s.replace('</head>',css+'</head>')
              p.write_text(s)
          PY
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine NaVue active navigation map presentation'
          git push
