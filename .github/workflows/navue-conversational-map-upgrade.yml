name: NaVue conversational map upgrade
on:
  push:
    paths:
      - '.github/workflows/navue-conversational-map-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Full-map driving UI: map stays full viewport, controls float above it.
          s=s.replace(".turn-card{position:absolute;top:18px;left:14px;right:76px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 14px #0002}.speaker{position:absolute;top:18px;right:14px;width:52px;height:52px;padding:0;margin:0;border-radius:50%;background:#fff;color:#172126}.nav-mic{position:absolute;right:14px;top:84px}.nav-bottom{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));background:#fff;border-radius:22px;padding:15px}.nav-metrics{display:grid;grid-template-columns:1.2fr 1fr 1fr;text-align:center}.nav-metrics strong{font-size:21px}.finish{padding:10px;font-size:14px}", ".turn-card{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;background:#fffffff2;border-radius:14px;padding:9px 12px;box-shadow:0 3px 14px #0002;z-index:6;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.turn-card .small{display:none}.turn-card strong{font-size:16px}.turn-card .nav-dest-change{width:auto;margin:0;padding:8px 10px;border-radius:10px;font-size:12px}.speaker{position:absolute;right:12px;bottom:148px;width:46px;height:46px;padding:0;margin:0;border-radius:50%;background:#fffffff2;color:#172126;z-index:7;box-shadow:0 3px 12px #0002}.nav-mic{position:absolute;right:12px;top:auto;bottom:88px;z-index:7;width:46px;min-width:46px;height:46px;border-radius:50%}.nav-mic:after{display:none}.nav-bottom{position:absolute;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));background:#fffffff2;border-radius:18px;padding:10px 12px;z-index:6;box-shadow:0 3px 14px #0002}.nav-bottom>.small{font-size:10px;margin-bottom:5px}.nav-metrics{display:grid;grid-template-columns:1.2fr 1fr 1fr;text-align:center;align-items:center}.nav-metrics strong{font-size:20px}.finish{position:absolute;right:8px;top:-35px;width:auto;padding:6px 9px;font-size:10px;border-radius:9px;background:#ffffffdd;color:#40515a;box-shadow:0 2px 8px #0002}")
          s=s.replace('<div class="turn-card"><div class="small">NEXT</div><strong>↑ Continue straight</strong><div>1.2 km</div></div>', '<div class="turn-card"><div><div class="small">NEXT</div><strong>↑ Continue straight · 1.2 km</strong></div><button class="nav-dest-change" onclick="requestDestinationChange()">New destination</button></div>')

          # Conversation state.
          s=s.replace("currentRoutes=[],lastSpoken='';", "currentRoutes=[],lastSpoken='',conversation={pending:null,lastIntent:null,lastTopic:null};")

          # Returning users must be greeted audibly once the app is opened.
          s=s.replace("load();p.onboarded?showHome(true):show('welcome');", "load();if(p.onboarded){voiceFlow=!!p.micEnabled;setTimeout(()=>showHome(true),120)}else show('welcome');")

          # Add navigation helpers before handleVoice.
          marker="function handleVoice(t,mode){"
          helpers=r'''function navRelevant(s){return /(map|route|road|street|highway|freeway|traffic|construction|road\s?work|police|officer|accident|crash|closure|closed|hazard|debris|object|shoulder|vehicle|car|truck|destination|navigate|navigation|trip|drive|driving|toll|ferry|gas|fuel|charge|charging|eta|arriv|distance|kilomet|km|minute|how much longer|how far|where am i going|home|work|mute|unmute|repeat|turn|lane|exit|reroute|another way|different way|avoid|stop navigation|end trip|cancel navigation|i'?m done)/i.test(s)}function isGreeting(s){return /^(good\s+(morning|afternoon|evening)|hello|hi|hey)(\s+navue)?[.! ]*$/i.test(s.trim())}function requestDestinationChange(){conversation.pending='destination';conversation.lastIntent='changeDestination';speak('Where would you like to go now?',true,p.voiceStyle,()=>{show('destination');voiceStatus.textContent='Listening for your new destination…';setTimeout(()=>startListen('destination',destMic,true),180)})}function requestEndTrip(){conversation.pending='endTrip';conversation.lastIntent='endTrip';speak('End this trip?',true,p.voiceStyle,()=>setTimeout(()=>startListen('navigation',navMic,true),180))}function answerNavQuestion(s){if(/how much longer|time left|how long/i.test(s))return speak((p.selectedRoute?.time||'')+' minutes remaining.',true);if(/how far|distance|kilomet|\bkm\b/i.test(s))return speak((p.selectedRoute?.km||'')+' kilometres remaining.',true);if(/when.*arriv|arrival time|\beta\b/i.test(s))return speak('Your estimated arrival is '+eta(p.selectedRoute?.time||0)+'.',true);if(/where am i going|what.*destination/i.test(s))return speak('You are navigating to '+p.destination+'.',true);if(/toll/i.test(s))return speak(p.selectedRoute?.cost&&p.selectedRoute.cost!='$0'?'This route includes about '+p.selectedRoute.cost+' in tolls.':'Your current route has no simulated toll cost.',true);return false}'''
          s=s.replace(marker,helpers+marker)

          # Replace voice handler with contextual navigation-domain handler.
          a=s.index('function handleVoice(t,mode){')
          b=s.index('const PS=',a)
          new=r'''function handleVoice(t,mode){let s=t.toLowerCase().trim();if(mode==='ambiguity'){let h=s.includes('toronto')?pending.find(x=>x.includes('Toronto')):s.includes('mississauga')?pending.find(x=>x.includes('Mississauga')):null;if(h){speak(h.includes('Toronto')?'Toronto selected.':'Mississauga selected.');return setTimeout(()=>selectDest(h,true),250)}ambiguityStatus.textContent='Please say Mississauga or Toronto.';return setTimeout(()=>startListen('ambiguity',ambiguityMic,true),450)}if(mode==='routes'){let id=routeFromSpeech(s),r=currentRoutes.find(x=>x.id===id);if(r)return chooseRoute(r,true);if(/another|different|alternative|fastest|shortest|eco/i.test(s)){let rr=/fastest/i.test(s)?currentRoutes.reduce((a,b)=>a.time<b.time?a:b):/eco/i.test(s)?currentRoutes.find(x=>x.badges.some(y=>y.includes('ECO'))):null;if(rr)return chooseRoute(rr,true)}speak('Please say Route A, Route B, or Route C.',false,p.voiceStyle,()=>startListen('routes',routeMic,true));return}if(mode==='navigation'){if(conversation.pending==='endTrip'){if(/^(yes|yeah|yep|please|do it|end it|stop it)/i.test(s)){conversation.pending=null;stopListen(false);return finishTrip()}if(/^(no|nope|keep going|continue)/i.test(s)){conversation.pending=null;return speak('Continuing your trip.',true)}conversation.pending=null}if(isGreeting(s))return speak(greet()+' Where are you going?',true);if(/end (the )?trip|stop navigation|cancel navigation|cancel (the )?trip|finish (the )?trip|i'?m done navigating/i.test(s))return requestEndTrip();if(/mute|voice off|turn voice off/.test(s)){tripVoice=false;setSpeaker();speechSynthesis.cancel();return setTimeout(()=>startListen('navigation',navMic,true),250)}if(/unmute|voice on|turn voice on/.test(s)){tripVoice=true;setSpeaker();return speak('Voice guidance on',true)}if(/repeat/.test(s))return speak(lastSpoken||'Continue straight for 1.2 kilometres.',true);if(/change (my )?destination|different destination|go somewhere else|new destination|change where|take me somewhere else/i.test(s))return requestDestinationChange();if(/take me home|go home/i.test(s)){p.destination='Home';conversation.lastTopic='destination';return buildRoutes(true)}if(answerNavQuestion(s))return;if(/construction|road\s?work/i.test(s)){conversation.lastTopic='construction';return speak('I heard you. There is construction ahead. I can help you consider another route.',true)}if(/foreign object|object on the road|debris|something (lying )?in the road/i.test(s)){conversation.lastTopic='hazard';return speak('I heard you. There is an object in the road. Please drive carefully.',true)}if(/police|officer/i.test(s)){conversation.lastTopic='police';return speak('I heard you. Police are ahead. Continue driving safely.',true)}if(/car|vehicle|truck/.test(s)&&/shoulder|stopped|parked/.test(s)){conversation.lastTopic='shoulder';return speak('I heard you. There is a vehicle on the shoulder. Please use caution.',true)}if(/another way|different way|go around|reroute|avoid this|avoid the highway/i.test(s)){conversation.lastTopic='route';return speak('I can look at another route. Would you like to change routes?',true)}if(!navRelevant(s))return setTimeout(()=>startListen('navigation',navMic,true),260);return speak('I heard you. Tell me what you would like to do with the route.',true)}if(mode==='routine'){let r=routine();if(/^yes/.test(s)&&r)return confirmRoutine(r);if(/^no/.test(s)){openDestination();speak('Where are we going?',false,p.voiceStyle,()=>startListen('destination',destMic,true));return}}if(isGreeting(s)){return speak(greet()+' Where are you going?',true,p.voiceStyle,()=>setTimeout(()=>rearmVoice(document.querySelector('.screen.active')?.id),180))}if(mode==='home'&&!navRelevant(s)){return setTimeout(()=>rearmVoice('home'),250)}if(mode==='home')openDestination();if(/\b(work|office|job)\b/i.test(t)){p.destination='Work';return buildRoutes(true)}if(/\b(home|house)\b/i.test(t)){p.destination='Home';return buildRoutes(true)}if(mode==='destination'&&!navRelevant(s)&&!/\d|street|road|avenue|drive|boulevard|lane|court|place|mall|centre|center|costco|restaurant|store|station/i.test(s)){voiceStatus.textContent='Listening for a destination…';return setTimeout(()=>startListen('destination',destMic,true),260)}destinationInput.value=t.replace(/^(i am|i'm|im|we are|we're) (going|heading|driving) (to )?/i,'').replace(/^(take me|navigate me|drive me) to /i,'').trim();destinationChanged();resolveDestination()}'''
          s=s[:a]+new+s[b:]

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Upgrade NaVue conversational navigation and full-map driving UI" || exit 0
          git push
