name: NaVue iPhone speaker toggle parity fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/navue-ios-speaker-toggle-parity.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror proven speaker off-on activation on first app gesture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* NAVUE_IOS_SPEAKER_TOGGLE_PARITY_V1 */'
          if marker in s: raise SystemExit('already installed')
          patch=r'''<script>/* NAVUE_IOS_SPEAKER_TOGGLE_PARITY_V1 */
          (function(){
            let done=false;
            function activateLikeSpeakerToggle(){
              if(done)return;
              try{
                if(!(window.p&&p.onboarded&&p.voice))return;
                done=true;
                // Mirror the exact proven OFF -> ON speaker path without changing mic code.
                if(typeof toggleMainVoice==='function'){
                  toggleMainVoice();
                  setTimeout(function(){
                    try{toggleMainVoice()}catch(e){}
                  },60);
                }
              }catch(e){}
            }
            // iPhone WebKit requires a real page interaction before audible synthesis.
            // Use the first normal app interaction to perform the same state transition
            // Gio proved works manually. Microphone functions are intentionally untouched.
            document.addEventListener('touchend',activateLikeSpeakerToggle,{once:true,capture:true,passive:true});
            document.addEventListener('click',activateLikeSpeakerToggle,{once:true,capture:true});
          })();
          </script>'''
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Mirror proven speaker toggle activation on iPhone'
          git push
