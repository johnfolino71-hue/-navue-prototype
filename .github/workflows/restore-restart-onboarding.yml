name: Restore Restart Onboarding testing control
on:
  push:
    paths:
      - '.github/workflows/restore-restart-onboarding.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore testing control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<button class="secondary" onclick="showHome(false)">Back</button></section><section id="arrival"'
          replacement='<div class="pref-title">Prototype Testing</div><button class="restart" onclick="restartOnboarding()">Restart Onboarding</button><button class="secondary" onclick="showHome(false)">Back</button></section><section id="arrival"'
          if 'onclick="restartOnboarding()"' not in s:
              assert marker in s, 'Settings insertion point not found'
              s=s.replace(marker,replacement,1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Restart Onboarding already present'
          else
            git commit -m 'Restore Restart Onboarding for prototype testing'
            git push
          fi