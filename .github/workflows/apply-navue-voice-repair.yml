name: Apply NaVue iPhone Voice Repair

on:
  push:
    branches: ["main"]
    paths:
      - "navue-voice-repair.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted voice repair
        run: python3 navue-voice-repair.py
      - name: Commit repaired application and remove one-time repair files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm navue-voice-repair.py .github/workflows/apply-navue-voice-repair.yml
          git commit -m "Repair NaVue iPhone system voice playback"
          git push
