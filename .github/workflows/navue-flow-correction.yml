name: NaVue flow correction
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          a='id="voiceScreen" class="screen"><div class="brand">NaVue</div><h1>How should NaVue sound?</h1><p>Preview each voice with your own greeting.</p><div id="voiceChoices"></div><button onclick="finishProfile()">Continue</button>'
          b='id="voiceScreen" class="screen"><div class="brand">NaVue</div><h1>How should NaVue sound?</h1><p>Preview each voice with your own greeting.</p><div id="voiceChoices"></div><button onclick="showVoiceGuidanceScreen()">Continue</button>'
          s=s.replace(a,b)
          a='<button onclick="showVoiceGuidanceScreen()">Continue</button></section><section id="voiceGuidanceScreen" class="screen"><div class="brand">NaVue</div><h1 id="profileHello">'
          b='<button onclick="finishProfile()">Continue</button></section><section id="profileStart" class="screen"><div class="brand">NaVue</div><h1 id="profileHello">'
          s=s.replace(a,b)
          p.write_text(s)
          PY
          git config user.name "NaVue Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct onboarding flow"
          git push
